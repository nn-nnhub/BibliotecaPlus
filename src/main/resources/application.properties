spring.application.name=biblioteca-plus

spring.datasource.url=jdbc:h2:file:./data/bibliotecadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Límite por conexión H2 para esperar bloqueos, en milisegundos (RFC-013).
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 2000
spring.datasource.hikari.exception-override-class-name=com.bibliotecaplus.config.H2LockTimeoutOverride

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
